<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ar-Condicionado ROI | Praia Digital</title><meta name="description" content="Calcule o retorno de instalar ou trocar ar-condicionado em imóvel de temporada: diária maior, avaliações melhores e energia."><style>*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}body{background:linear-gradient(160deg,#e8f1fb,#f7f3ea);padding:1rem;color:#123}.card{max-width:640px;margin:auto;background:#fff;border-radius:18px;padding:1.6rem;box-shadow:0 8px 30px #27548a22}h1{color:#1f4470;font-size:1.5rem}label{display:block;margin-top:1rem;font-weight:600;font-size:.9rem}input,select{width:100%;padding:.6rem;border:2px solid #d2e0ef;border-radius:10px;font-size:1rem}button{margin-top:1.4rem;width:100%;padding:.9rem;background:#27548a;color:#fff;border:0;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer}#res{margin-top:1.4rem;display:none;background:#ebf2fa;border-radius:12px;padding:1rem}nav{max-width:640px;margin:1rem auto;font-size:.85rem;text-align:center}nav a{color:#27548a;margin:0 .5rem;text-decoration:none}</style></head><body><nav><a href="https://praia.digital">🌊 Praia Digital</a> · <a href="https://praia.digital/amenidade-roi">Amenidade ROI</a> · <a href="https://praia.digital/brisa-vento">Brisa & Vento</a> · <a href="https://praia.digital/conta-luz">Conta Luz</a></nav><div class="card"><h1>❄️ Ar-Condicionado ROI</h1><p>Vale instalar ou trocar? O verão do litoral responde por você.</p><label>Cenário</label><select id="c"><option value="instalar">Não tenho AC e quero instalar</option><option value="trocar" selected>Trocar AC antigo por inverter</option></select><label>Unidades necessárias</label><input id="u" type="number" value="2"><label>Custo por unidade instalada (R$)</label><input id="p" type="number" value="2800"><label>Aumento esperado na diária (R$)</label><input id="d" type="number" value="50"><label>Diárias vendidas/mês</label><input id="v" type="number" value="12"><button onclick="calc()">Calcular ROI</button><div id="res"></div></div><script>function calc(){const g=id=>+document.getElementById(id).value;const cen=document.getElementById('c').value,u=g('u'),p=g('p'),d=g('d'),v=g('v');const inv=u*p,ecoMes=cen==='trocar'?90*u:0;const ganho=d*v+ecoMes,payback=inv/ganho;document.getElementById('res').style.display='block';document.getElementById('res').innerHTML=`<p>💰 Investimento total: <b>R$ ${inv.toFixed(0)}</b></p><p>📈 Ganho mensal estimado: <b>R$ ${ganho.toFixed(0)}</b> (diária + R$ ${(d*v).toFixed(0)}${ecoMes?' + energia economizada R$ '+ecoMes:''})</p><p>⏳ Payback: <b>${payback.toFixed(1)} meses</b> ${payback<12?'✅ excelente!':payback<24?'👍 bom':'⚠️ longo — revise o aumento de diária'}</p><p>💡 Imóveis com AC inverter ganham destaque nos filtros do Airbnb. Combine com ventilação natural do <a href="https://praia.digital/brisa-vento">Brisa & Vento</a> e corte o resto na <a href="https://praia.digital/conta-luz">Conta Luz</a>.</p>`}</script></body></html>
